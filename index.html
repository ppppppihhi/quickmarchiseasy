<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QUICKMARCH PRACTICE</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fb;
    color: #1f2937;
    min-height: 100vh;
}

/* =====================================================
   HEADER
===================================================== */

header {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    padding: 22px 20px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}

header h1 {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 1px;
}

header p {
    margin-top: 6px;
    font-size: 14px;
    opacity: 0.9;
}

/* =====================================================
   MAIN CONTAINER
===================================================== */

.container {
    width: 95%;
    max-width: 1200px;
    margin: 25px auto;
}

/* =====================================================
   SUBJECT TABS
===================================================== */

.subject-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 25px;
}

.subject-btn {
    border: none;
    border-radius: 12px;
    padding: 17px 10px;
    background: white;
    color: #374151;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    transition: all 0.2s ease;
}

.subject-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.12);
}

.subject-btn.active {
    background: #2563eb;
    color: white;
}

/* =====================================================
   TEST LIST
===================================================== */

.test-panel {
    background: white;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.test-panel h2 {
    font-size: 22px;
    margin-bottom: 8px;
}

.test-description {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 20px;
}

.test-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.test-btn {
    border: 1px solid #dbe3ef;
    background: #f8fafc;
    border-radius: 10px;
    padding: 15px 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    color: #1f2937;
    transition: all 0.2s ease;
}

.test-btn:hover {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
    transform: translateY(-2px);
}

/* =====================================================
   TEST AREA
===================================================== */

#testArea {
    margin-top: 25px;
}

.test-header {
    background: white;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.test-header h2 {
    font-size: 24px;
    margin-bottom: 8px;
}

.test-header p {
    color: #6b7280;
    font-size: 14px;
}

/* =====================================================
   CONTENT
===================================================== */

.test-content {
    background: white;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    min-height: 200px;
}

/* =====================================================
   EMPTY / LOADING / ERROR
===================================================== */

.message {
    text-align: center;
    padding: 50px 20px;
    color: #6b7280;
}

.message h3 {
    color: #374151;
    margin-bottom: 10px;
}

.error-message {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    border-radius: 10px;
    padding: 18px;
    line-height: 1.6;
}

.loading {
    text-align: center;
    padding: 40px;
    color: #2563eb;
    font-weight: 700;
}

/* =====================================================
   BACK BUTTON
===================================================== */

.back-btn {
    margin-top: 20px;
    border: none;
    background: #374151;
    color: white;
    border-radius: 8px;
    padding: 11px 18px;
    cursor: pointer;
    font-weight: 700;
}

.back-btn:hover {
    background: #111827;
}

/* =====================================================
   FOOTER
===================================================== */

footer {
    text-align: center;
    padding: 30px 15px;
    color: #9ca3af;
    font-size: 13px;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 800px) {

    .subject-tabs {
        grid-template-columns: repeat(2, 1fr);
    }

    .test-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 500px) {

    header h1 {
        font-size: 24px;
    }

    .subject-tabs {
        grid-template-columns: 1fr 1fr;
    }

    .test-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .test-panel,
    .test-content,
    .test-header {
        padding: 18px;
    }
}

</style>

</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header>

```
<h1>QUICKMARCH PRACTICE</h1>

<p>
    English Practice System
</p>
```

</header>

<!-- =====================================================
     MAIN
===================================================== -->

<div class="container">

```
<!-- SUBJECT BUTTONS -->

<div class="subject-tabs">

    <button
        class="subject-btn active"
        data-subject="listening"
        onclick="selectSubject('listening')">
        🎧 Listening
    </button>

    <button
        class="subject-btn"
        data-subject="reading"
        onclick="selectSubject('reading')">
        📖 Reading
    </button>

    <button
        class="subject-btn"
        data-subject="speaking"
        onclick="selectSubject('speaking')">
        🎤 Speaking
    </button>

    <button
        class="subject-btn"
        data-subject="writing"
        onclick="selectSubject('writing')">
        ✍️ Writing
    </button>

</div>


<!-- TEST LIST -->

<div class="test-panel">

    <h2 id="subjectTitle">
        Listening
    </h2>

    <p class="test-description">
        Select a test to begin.
    </p>

    <div
        id="testList"
        class="test-grid">
    </div>

</div>


<!-- TEST AREA -->

<div id="testArea">

    <div class="message">

        <h3>
            Welcome to QUICKMARCH PRACTICE
        </h3>

        <p>
            Choose a subject and select a test.
        </p>

    </div>

</div>
```

</div>

<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

```
QUICKMARCH PRACTICE
```

</footer>

<script>

/* =====================================================
   QUICKMARCH PRACTICE
   MAIN APPLICATION

   IMPORTANT:
   Do not edit this file when adding a new test.

   Test files are loaded independently from:

   tests/listening/test01.js
   tests/listening/test02.js
   ...
   tests/reading/test01.js
   ...
   tests/speaking/test01.js
   ...
   tests/writing/test01.js

===================================================== */


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

var currentSubject = "listening";
var currentTest = null;


/* =====================================================
   SUBJECT INFORMATION
===================================================== */

var SUBJECTS = {

    listening: {
        title: "Listening",
        icon: "🎧"
    },

    reading: {
        title: "Reading",
        icon: "📖"
    },

    speaking: {
        title: "Speaking",
        icon: "🎤"
    },

    writing: {
        title: "Writing",
        icon: "✍️"
    }

};


/* =====================================================
   INITIALIZE
===================================================== */

document.addEventListener("DOMContentLoaded", function() {

    selectSubject("listening");

});


/* =====================================================
   SELECT SUBJECT
===================================================== */

function selectSubject(subject) {

    currentSubject = subject;

    currentTest = null;

    updateSubjectButtons();

    updateSubjectTitle();

    showTestList();

    clearTestArea();

}


/* =====================================================
   UPDATE SUBJECT BUTTONS
===================================================== */

function updateSubjectButtons() {

    var buttons =
        document.querySelectorAll(".subject-btn");

    for (var i = 0; i < buttons.length; i++) {

        var button = buttons[i];

        if (button.getAttribute("data-subject") === currentSubject) {

            button.classList.add("active");

        } else {

            button.classList.remove("active");

        }

    }

}


/* =====================================================
   UPDATE SUBJECT TITLE
===================================================== */

function updateSubjectTitle() {

    var info = SUBJECTS[currentSubject];

    document.getElementById("subjectTitle").textContent =
        info.icon + " " + info.title;

}


/* =====================================================
   SHOW TEST LIST
===================================================== */

function showTestList() {

    var container =
        document.getElementById("testList");

    container.innerHTML = "";

    /*
       QUICKMARCH supports Test 01 → Test 19.

       Adding a new test file does NOT require changing
       index.html.

       Example:

       tests/writing/test01.js
       tests/writing/test02.js
       tests/writing/test03.js

       The corresponding button already exists.
    */

    for (var i = 1; i <= 19; i++) {

        var button =
            document.createElement("button");

        button.className = "test-btn";

        var number =
            i < 10 ? "0" + i : String(i);

        button.textContent =
            "Test " + number;

        button.setAttribute(
            "data-test-number",
            number
        );

        button.onclick = (function(testNumber) {

            return function() {

                loadTest(testNumber);

            };

        })(number);

        container.appendChild(button);

    }

}


/* =====================================================
   LOAD TEST
===================================================== */

function loadTest(testNumber) {

    currentTest = testNumber;

    var testPath =
        "tests/" +
        currentSubject +
        "/test" +
        testNumber +
        ".js";

    showLoading(testPath);


    /*
       Remove previously loaded TEST_DATA.

       This prevents one test from accidentally being
       displayed when another test is selected.
    */

    window.TEST_DATA = null;


    /*
       Create a new script element.
    */

    var oldScript =
        document.getElementById("quickmarch-test-script");

    if (oldScript) {

        oldScript.parentNode.removeChild(oldScript);

    }


    var script =
        document.createElement("script");

    script.id =
        "quickmarch-test-script";

    script.src =
        testPath + "?v=" + Date.now();

    script.onload = function() {

        /*
           The test file must create:

           window.TEST_DATA = {...}
        */

        if (
            typeof window.TEST_DATA === "undefined" ||
            window.TEST_DATA === null
        ) {

            showError(
                "The test file loaded successfully, " +
                "but TEST_DATA was not found.<br><br>" +

                "Please check:<br>" +

                "<code>" +
                testPath +
                "</code><br><br>" +

                "The file must contain:<br>" +

                "<code>" +
                "window.TEST_DATA = { ... };" +
                "</code>"
            );

            return;

        }


        renderTest(
            window.TEST_DATA,
            testPath
        );

    };


    script.onerror = function() {

        showError(
            "Unable to load this test.<br><br>" +

            "The system tried to load:<br>" +

            "<code>" +
            testPath +
            "</code><br><br>" +

            "Please check that this file exists " +
            "in your GitHub repository."
        );

    };


    document.body.appendChild(script);

}


/* =====================================================
   SHOW LOADING
===================================================== */

function showLoading(path) {

    var area =
        document.getElementById("testArea");

    area.innerHTML =

        '<div class="test-content">' +

            '<div class="loading">' +

                'Loading test...<br><br>' +

                '<small>' +
                path +
                '</small>' +

            '</div>' +

        '</div>';

}


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(message) {

    var area =
        document.getElementById("testArea");

    area.innerHTML =

        '<div class="test-content">' +

            '<div class="error-message">' +

                '<strong>⚠️ Test Loading Error</strong>' +

                '<br><br>' +

                message +

            '</div>' +

            '<button ' +
                'class="back-btn" ' +
                'onclick="clearTestArea()">' +

                '← Back to Tests' +

            '</button>' +

        '</div>';

}


/* =====================================================
   RENDER TEST
===================================================== */

function renderTest(data, path) {

    var area =
        document.getElementById("testArea");


    /*
       Safely obtain test title.
    */

    var title =
        data.title ||
        SUBJECTS[currentSubject].title +
        " Test " +
        currentTest;


    var description =
        data.description ||
        "";


    /*
       If the test file provides its own renderer,
       use it.

       This is important because Listening,
       Reading, Speaking and Writing can have
       completely different interfaces.
    */

    if (typeof data.render === "function") {

        area.innerHTML =

            '<div class="test-header">' +

                '<h2>' +
                title +
                '</h2>' +

                '<p>' +
                description +
                '</p>' +

            '</div>' +

            '<div ' +
                'class="test-content" ' +
                'id="testContent">' +

            '</div>';


        try {

            data.render(
                document.getElementById("testContent")
            );

        } catch (error) {

            showError(
                "The test file loaded, but an error " +
                "occurred while displaying the test.<br><br>" +

                "<code>" +
                error.message +
                "</code>"
            );

        }

        return;

    }


    /*
       If there is no custom renderer,
       display the data in a safe basic format.

       This allows us to add the actual test
       structure later without changing the
       loading system.
    */

    area.innerHTML =

        '<div class="test-header">' +

            '<h2>' +
            escapeHTML(title) +
            '</h2>' +

            '<p>' +
            escapeHTML(description) +
            '</p>' +

        '</div>' +

        '<div class="test-content">' +

            '<div class="message">' +

                '<h3>Test loaded successfully</h3>' +

                '<p>' +

                    'The file ' +

                    '<strong>' +

                    escapeHTML(path) +

                    '</strong> ' +

                    'has been loaded.' +

                '</p>' +

            '</div>' +

        '</div>';


}


/* =====================================================
   CLEAR TEST AREA
===================================================== */

function clearTestArea() {

    var area =
        document.getElementById("testArea");

    area.innerHTML =

        '<div class="message">' +

            '<h3>' +

            'Welcome to QUICKMARCH PRACTICE' +

            '</h3>' +

            '<p>' +

            'Choose a test to begin.' +

            '</p>' +

        '</div>';

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    if (value === null || value === undefined) {

        return "";

    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>
